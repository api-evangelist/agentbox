summary: >-
  Reapit | Agentbox ships no first-party client library in any language, no CLI and
  no published GitHub organisation for the ANZ product. What exists is a small
  set of community and integrator-built clients written against the undocumented
  API. They are listed here because they are the only working reference material a
  new integrator has - none is official, none is supported by the vendor, and none
  should be treated as a contract. Registry name collisions were excluded: the
  npm/GitHub "agentbox" namespace is dominated by unrelated AI-agent sandbox
  projects (madarco/agentbox, TwillAI/agentbox-sdk, langgenius/dify-agentbox,
  rcarmo/agentbox and others) and the PyPI "agentbox" package is dotagent's
  AI sandbox, none of which relate to this real-estate CRM.
