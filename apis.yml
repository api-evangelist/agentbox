apis:
- aid: agentbox:agentbox-api
  name: Agentbox API
  description: The production Agentbox (Reapit Sales) REST API used by approved integration
    partners to read and write agency CRM data - contacts, listings, properties, staff
    and offices. The host is live and fronted by a Tyk gateway - an anonymous request
    returns HTTP 401 with {"error":"Authorization field missing"}, and supplying an
    X-API-Key header advances the request past the gateway, confirming API-key
    authentication. Third-party integration guides (Domo, Auctions Live, WordPress
    connectors) consistently describe the same credential triple - API Key, Client ID
    and Office ID - issued per agency office by Reapit Sales support. No public API
    reference, OpenAPI/Swagger document or Postman collection is published - every
    documentation path probed on the gateway returned 401 or 404 - so no machine-readable
    contract could be harvested. Access requires completing the Integrator Application
    and being approved.
  humanURL: https://www.agentbox.com.au/integrator-application
