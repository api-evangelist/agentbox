name: Agentbox
kind: company
description: Agentbox - rebranded Reapit Sales after its acquisition by the UK-headquartered
  proptech group Reapit - is an Australian real estate CRM and sales platform used by
  residential sales agencies across Australia and New Zealand, covering contacts and
  prospecting, listing management, appraisals, vendor management, marketing, agency
  websites, and a mobile agent app. Its position in the value chain is the agency
  system of record and, critically, the portal uploader - Agentbox is the system that
  pushes an agency's for-sale and for-rent listings out to realestate.com.au,
  domain.com.au, allhomes, commercialrealestate.com.au and dozens of other Australian
  portals, which in the Australian market is the REAXML feed seam rather than an MLS.
  Its API posture is honest but closed - a production API gateway is live at
  api.agentboxcrm.com.au (Tyk, HTTP 401 "Authorization field missing" to anonymous
  callers, authenticated with an X-API-Key header alongside a Client ID and Office ID),
  but there is no public developer portal, no published reference, and no downloadable
  machine-readable contract. Access is application-approval only - every third party
  must complete the Reapit Sales Integrator Application and be reviewed before an
  agency's API Key, Client ID and Office ID are issued by support. There is no RESO
  Web API or Data Dictionary certification, no OData $metadata document, and no
  Universal Property Identifier - RESO is a North American MLS regime with no
  presence in this Australian vendor's surface - and no open data is published.
