entries:
- date: '2025-06-30'
  title: 3 New Agentbox Websites Features
  area: Websites
  breaking: false
  highlights:
  - Floor area filter on commercial property search results
  - Customise which details appear on home page property tiles
  - Modular search results display with configurable data fields
- date: '2025-05-28'
  title: Universal Search
  area: CRM
  breaking: false
  highlights:
  - Category pre-filtering before running a search
  - Search result counts per category
  - Keyboard navigation (CTRL+K / CMD+K, arrows, Tab, Enter, ESC)
  - Listings prioritised ahead of Contacts in results
- date: '2025-05-28'
  title: 'New Template: General Proposals'
  area: Proposals
  breaking: false
  highlights:
  - Proposal creation without a property address
  - Sections for Team, Services, Marketing Investment and RateMyAgent reviews
- date: '2025-04-29'
  title: Custom Fonts in Proposals
  area: Proposals
  breaking: false
  highlights:
  - Agencies can add their own licensed fonts to specific themes
  - Separate fonts for headings and body text
- date: '2025-04-29'
  title: Customisable cover pages for PDF proposals
  area: Proposals
  breaking: false
  highlights:
  - '"Set as Cover" is now OFF by default so proposals are shorter'
  - PDF preview updates instantly on toggle
- date: '2025-04-29'
  title: Documents Upload module
  area: Proposals
  breaking: false
  highlights:
  - Upload .pdf, .doc or .docx up to 10MB per file into Sales and Property
