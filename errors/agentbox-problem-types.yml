  source: live probe GET https://api.agentboxcrm.com.au/ (anonymous)
- status: 404
  title: URL not found
  media_type: text/html
  layer: backend
  cause: Request passed the gateway auth check but addressed a path the backend
    application does not route.
  remediation: Use a documented resource path. Note the response is an HTML page,
    not JSON - clients must not assume a JSON error body once past the gateway.
  source: 'live probe GET https://api.agentboxcrm.com.au/listings?version=2
    [X-API-Key: test]'
