summary: >-
  Agentbox publishes no error reference. This catalog records only the error
  responses observed directly on the production gateway - it is deliberately short
  because it contains nothing that was not returned by the live host. The gateway
  layer answers JSON with a flat {"error": "..."} envelope; the backend application
  behind it does not, returning an HTML error page for an unrouted path, which is
  an inconsistency an integrator has to handle.
